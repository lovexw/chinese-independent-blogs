<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>博客列表管理 · BlogHao Ops</title>
<style>
  :root {
    --bg1:#f8f4ee; --bg2:#f1ebe1; --card:#ffffff; --line:#e9e2d6; --line2:#f0ebe2;
    --fg:#1f232b; --dim:#8a8f9c; --ok:#2e9e5b; --okbg:#e8f5ec; --warn:#b97d10; --warnbg:#fdf3dd;
    --bad:#c0392b; --badbg:#fdeeec; --acc:#b13a2b; --acc-dark:#9c3223;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:linear-gradient(180deg, var(--bg1), var(--bg2)); min-height:100vh; color:var(--fg); font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { background:rgba(255,255,255,.9); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:9; backdrop-filter:blur(6px); }
  .hbar { max-width:1080px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:12px; }
  .seal { width:34px; height:34px; border-radius:9px; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; box-shadow:0 2px 6px rgba(177,58,43,.3); }
  .brand { font-weight:700; font-size:16.5px; letter-spacing:.5px; }
  .brand small { color:var(--dim); font-weight:400; margin-left:8px; font-size:13px; }
  .hspacer { flex:1; }
  .wrap { max-width:1080px; margin:0 auto; padding:28px 20px 70px; }
  h1.page { font-size:24px; margin:0 0 6px; }
  .desc { color:var(--dim); font-size:13.5px; margin-bottom:22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(31,35,43,.04); }
  .tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .tab { cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--fg); padding:8px 18px; border-radius:999px; font-size:14px; }
  .tab.on { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; box-shadow:0 2px 6px rgba(177,58,43,.25); }
  .name { font-weight:600; font-size:15.5px; }
  .grade { font-size:12px; padding:2px 9px; border-radius:999px; }
  .gA { background:var(--okbg); color:var(--ok); } .gB { background:var(--warnbg); color:var(--warn); } .gC { background:var(--badbg); color:var(--bad); }
  .meta { color:var(--dim); font-size:12.5px; margin-top:5px; word-break:break-all; }
  .meta a { color:var(--acc); text-decoration:none; }
  .badge { display:inline-block; margin:2px 6px 2px 0; padding:2px 9px; border-radius:999px; font-size:12px; background:#f6f2ea; color:#6b6f7a; }
  .badge.ok { background:var(--okbg); color:var(--ok); } .badge.bad { background:var(--badbg); color:var(--bad); } .badge.warn { background:var(--warnbg); color:var(--warn); }
  .pill-ok { display:inline-block; padding:3px 12px; border-radius:999px; background:var(--okbg); color:var(--ok); font-size:12.5px; font-weight:600; }
  .acts { margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { cursor:pointer; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--fg); padding:8px 18px; font-size:13.5px; }
  button:hover { border-color:#d9d0c2; }
  .primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; box-shadow:0 2px 6px rgba(177,58,43,.25); }
  .primary:hover { background:var(--acc-dark); }
  .danger { color:var(--bad); border-color:#eccfca; background:#fff; }
  .danger:hover { background:var(--badbg); }
  button:disabled { opacity:.5; cursor:default; }
  .err { color:var(--bad); font-size:13px; white-space:pre-wrap; }
  input { padding:9px 13px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--fg); font-size:14px; }
  input:focus { outline:2px solid rgba(177,58,43,.25); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .row input { flex:1; min-width:180px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td, th { padding:9px 8px; border-bottom:1px solid var(--line2); text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:12.5px; }
  tr:hover td { background:#faf7f1; }
  td a { color:var(--acc); text-decoration:none; word-break:break-all; }
  .empty { text-align:center; color:var(--dim); padding:50px 0; }
  .stats-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:16px; }
  .scard { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center; box-shadow:0 1px 3px rgba(31,35,43,.04); }
  .scard .num { font-size:24px; font-weight:800; }
  .scard .lbl { font-size:12px; color:var(--dim); margin-top:2px; }
  .bars { display:flex; align-items:flex-end; gap:4px; height:96px; margin:12px 0 4px; }
  .bar { flex:1; background:var(--acc); border-radius:4px 4px 0 0; min-height:2px; opacity:.9; position:relative; }
  .bar:hover::after { content:attr(data-v); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:#fff; border:1px solid var(--line); padding:2px 8px; border-radius:8px; font-size:11px; white-space:nowrap; box-shadow:0 2px 6px rgba(31,35,43,.08); }
  .bar-lbls { display:flex; gap:4px; font-size:10px; color:var(--dim); }
  .bar-lbls span { flex:1; text-align:center; overflow:hidden; }
  .done { font-size:13px; color:var(--dim); padding:9px 0; border-bottom:1px solid var(--line2); display:flex; justify-content:space-between; gap:10px; }
  .checkline { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--dim); }
  .more { text-align:center; margin-top:12px; }
</style>
</head>
<body>
<header><div class="hbar">
  <div class="seal">博</div>
  <div class="brand">博客列表管理<small>BlogHao Ops · 中文独立博客列表</small></div>
  <div class="hspacer"></div>
  <span class="pill-ok" id="loginState" style="display:none">● 已登录</span>
</div></header>
<div class="wrap">
<div id="app"><div class="empty">加载中…</div></div>
</div>
<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let shell, blogsCache = null;

async function api(path, body) {
  const r = await fetch(path, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) } : {});
  if (r.status === 401) { renderLogin(); throw new Error('unauthorized'); }
  return r.json();
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const c = $(`<div class="card" style="max-width:380px;margin:70px auto"><h1 class="page" style="font-size:20px">博客列表管理</h1><div class="desc">请输入管理账号</div><input id="user" placeholder="用户名" autocomplete="username" autofocus style="width:100%"><input id="pw" type="password" placeholder="密码" autocomplete="current-password" style="width:100%;margin-top:10px"><div class="err"></div><div class="acts"><button class="primary" style="flex:1">登录</button></div></div>`);
  app.appendChild(c);
  const doLogin = async () => {
    const r = await fetch('admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: c.querySelector('#user').value, password: c.querySelector('#pw').value }) });
    if (r.ok) { document.getElementById('loginState').style.display = ''; renderShell(); switchTab('pending'); } else { c.querySelector('.err').textContent = '用户名或密码错误'; }
  };
  c.querySelector('button').onclick = doLogin;
  const onEnter = (e) => { if (e.key === 'Enter') doLogin(); };
  c.querySelector('#user').onkeydown = onEnter;
  c.querySelector('#pw').onkeydown = onEnter;
}

function renderShell() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  shell = $(`<div>
    <h1 class="page">博客列表管理</h1>
    <div class="desc">用户提交审核 · 收录编辑与删除 · 访问统计（匿名 PV 与外链点击）</div>
    <div class="tabs">
      <button class="tab on" data-t="pending">待审提交</button>
      <button class="tab" data-t="manage">博客管理</button>
      <button class="tab" data-t="stats">访问统计</button>
      <button id="out" style="margin-left:auto">退出登录</button>
    </div>
    <div id="pane"></div>
  </div>`);
  shell.querySelectorAll('.tab').forEach((b) => b.onclick = () => switchTab(b.dataset.t));
  shell.querySelector('#out').onclick = async () => { await fetch('admin/logout', { method:'POST' }); renderLogin(); };
  app.appendChild(shell);
}

function switchTab(t) {
  shell.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'pending') loadPending();
  if (t === 'manage') renderManage();
  if (t === 'stats') loadStats();
}

// ---------- 待审提交 ----------

function verdictBadges(v) {
  let h = '';
  h += v.reachable === true ? '<span class="badge ok">站点可达</span>' : v.reachable === false ? '<span class="badge bad">不可达</span>' : '<span class="badge">未检测</span>';
  h += v.rssOk === true ? '<span class="badge ok">RSS 正常</span>' : v.rssOk === false ? '<span class="badge warn">RSS 未解析</span>' : '<span class="badge">RSS 未填</span>';
  for (const s of v.suspicious || []) h += '<span class="badge bad">' + esc(s) + '</span>';
  for (const n of v.notes || []) h += '<span class="badge">' + esc(n) + '</span>';
  return h;
}

async function loadPending() {
  const pane = shell.querySelector('#pane');
  pane.innerHTML = '<div class="empty">加载中…</div>';
  const data = await api('admin/api/list');
  pane.innerHTML = '';
  const pend = data.submissions.filter((s) => s.status === 'pending');
  if (!pend.length) pane.appendChild($(`<div class="empty">暂无待审提交 ✓</div>`));
  for (const s of pend) {
    const d = new Date(s.ts).toLocaleString('zh-CN');
    const card = $(`<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="name">${esc(s.name)}</span><span class="grade g${esc(s.grade)}">${esc(s.grade)} 级</span></div><div class="meta">${esc(s.url)}${s.rss ? ' · <a href="' + esc(s.rss) + '">RSS</a>' : ''}</div>${s.desc ? '<div class="meta">' + esc(s.desc) + '</div>' : ''}${s.tags.length ? '<div class="meta">标签: ' + esc(s.tags.join('；')) + '</div>' : ''}<div style="margin-top:8px">${verdictBadges(s.verdict)}</div><div class="meta">IP ${esc(s.ip)} · ${esc(d)}</div><div class="acts"><button class="primary b-ok">通过并上架</button><button class="danger b-no">拒绝</button><span class="err"></span></div></div>`);
    const errEl = card.querySelector('.err');
    card.querySelector('.b-ok').onclick = async (e) => {
      e.target.disabled = true; errEl.textContent = '正在写入列表并重建…';
      try {
        const r = await api('admin/api/action', { id: s.id, action: 'approve' });
        if (r.ok) { blogsCache = null; loadPending(); } else { errEl.textContent = r.error || '失败'; e.target.disabled = false; }
      } catch (err) { if (err.message !== 'unauthorized') { errEl.textContent = String(err); e.target.disabled = false; } }
    };
    card.querySelector('.b-no').onclick = async (e) => {
      e.target.disabled = true;
      await api('admin/api/action', { id: s.id, action: 'reject' });
      loadPending();
    };
    pane.appendChild(card);
  }
  const done = data.submissions.filter((s) => s.status !== 'pending').slice(-20).reverse();
  if (done.length) {
    pane.appendChild($(`<div style="font-size:14px;color:var(--dim);font-weight:600;margin:26px 0 10px">最近处理</div>`));
    for (const s of done) {
      pane.appendChild($(`<div class="done"><span>${s.status === 'approved' ? '✅' : '❌'} ${esc(s.name)}</span><span>${esc(new Date(s.reviewedAt || s.ts).toLocaleString('zh-CN'))}</span></div>`));
    }
  }
}

// ---------- 博客管理（打开即全量加载，本地毫秒过滤）----------

async function renderManage() {
  const pane = shell.querySelector('#pane');
  if (!blogsCache) {
    pane.innerHTML = '<div class="empty">加载全部收录列表…</div>';
    const data = await api('admin/api/blogs');
    blogsCache = data.blogs;
  }
  pane.innerHTML = '';
  const box = $(`<div>
    <div class="card" style="padding:12px 16px"><div class="row" style="margin:0"><input id="mq" placeholder="即时搜索：名称 / 域名 / 标签（共 ${blogsCache.length} 条，本地过滤零延迟）"><span class="pill-ok" id="mcount"></span></div></div>
    <div id="mres"></div>
  </div>`);
  pane.appendChild(box);
  const mq = box.querySelector('#mq');
  let debounce = null;
  mq.oninput = () => { clearTimeout(debounce); debounce = setTimeout(() => renderBlogs(mq.value.trim()), 80); };
  renderBlogs('');

  function renderBlogs(q) {
    const res = box.querySelector('#mres');
    const qq = q.toLowerCase();
    const hit = qq
      ? blogsCache.filter((b) => b.name.toLowerCase().includes(qq) || b.url.toLowerCase().includes(qq) || b.rss.toLowerCase().includes(qq) || b.tags.join(';').toLowerCase().includes(qq))
      : blogsCache;
    box.querySelector('#mcount').textContent = `匹配 ${hit.length}`;
    res.innerHTML = '';
    if (!hit.length) { res.appendChild($(`<div class="empty">没有匹配的博客</div>`)); return; }
    const tbl = $(`<div class="card" style="padding:6px 16px"><table><thead><tr><th style="width:24%">名称</th><th>地址与 RSS</th><th style="width:15%">最近更新</th><th style="width:140px">操作</th></tr></thead><tbody></tbody></table></div>`);
    const tbody = tbl.querySelector('tbody');
    const shown = hit.slice(0, renderBlogs.limit || 30);
    for (const b of shown) {
      const tr = $(`<tr><td style="font-weight:600">${esc(b.name)}</td><td><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.url)}</a>${b.rss ? '<br><span style="color:var(--dim);font-size:12px">RSS: ' + esc(b.rss) + '</span>' : ''}<br><span style="color:var(--dim);font-size:12px">${esc(b.tags.join('；'))}</span></td><td>${b.lastUpdate ? esc(b.lastUpdate.slice(0, 10)) : '<span style="color:var(--dim)">未知</span>'}</td><td><button class="e-btn">编辑</button> <button class="d-btn danger">删除</button></td></tr>`);
      tr.querySelector('.e-btn').onclick = () => showEditForm(b);
      tr.querySelector('.d-btn').onclick = () => showDeleteForm(b);
      tbody.appendChild(tr);
    }
    res.appendChild($(`<div class="sub" style="margin:2px 2px 8px;font-size:12.5px">显示 ${shown.length} / ${hit.length} 条</div>`));
    res.appendChild(tbl);
    if (hit.length > shown.length) {
      const more = $(`<div class="more"><button id="mload">显示更多（剩余 ${hit.length - shown.length}）</button></div>`);
      more.querySelector('button').onclick = () => { renderBlogs.limit = shown.length + 60; renderBlogs(q); };
      res.appendChild(more);
    }
  }

  function showEditForm(b) {
    const old = pane.querySelector('.edit-card');
    if (old) old.remove();
    const card = $(`<div class="card edit-card"><div class="name">编辑：${esc(b.name)}</div><div class="row" style="margin-top:10px"><input id="e-name" value="${esc(b.name)}" placeholder="名称"></div><div class="row"><input id="e-url" value="${esc(b.url)}" placeholder="博客地址"></div><div class="row"><input id="e-rss" value="${esc(b.rss)}" placeholder="RSS（可留空）"></div><div class="row"><input id="e-tags" value="${esc(b.tags.join('; '))}" placeholder="标签（; 分隔）"></div><div class="acts"><button class="primary e-save">保存并重建</button><button class="e-cancel">取消</button><span class="err"></span></div></div>`);
    box.prepend(card);
    card.scrollIntoView({ behavior:'smooth', block:'nearest' });
    card.querySelector('.e-cancel').onclick = () => card.remove();
    card.querySelector('.e-save').onclick = async (e) => {
      e.target.disabled = true;
      const errEl = card.querySelector('.err');
      errEl.textContent = '正在保存并重建站点…（约 10 秒）';
      try {
        const r = await api('admin/api/edit', { url: b.url, name: card.querySelector('#e-name').value, newUrl: card.querySelector('#e-url').value, rss: card.querySelector('#e-rss').value, tags: card.querySelector('#e-tags').value });
        if (r.ok) { blogsCache = null; renderBlogs.limit = 30; renderManage(); } else { errEl.textContent = r.error || '失败'; e.target.disabled = false; }
      } catch (err) { if (err.message !== 'unauthorized') { errEl.textContent = String(err); e.target.disabled = false; } }
    };
  }

  function showDeleteForm(b) {
    const old = pane.querySelector('.edit-card');
    if (old) old.remove();
    const card = $(`<div class="card edit-card" style="border-color:#eccfca;background:#fffbfa"><div class="name" style="color:var(--bad)">删除：${esc(b.name)}</div><div class="meta" style="margin:6px 0">${esc(b.url)}</div><label class="checkline"><input type="checkbox" id="d-black" checked style="width:auto"> 同时拉黑（写入墓园，上游同步永不回加）</label><div class="acts"><button class="danger d-confirm">确认删除</button><button class="d-cancel">取消</button><span class="err"></span></div></div>`);
    box.prepend(card);
    card.scrollIntoView({ behavior:'smooth', block:'nearest' });
    card.querySelector('.d-cancel').onclick = () => card.remove();
    card.querySelector('.d-confirm').onclick = async (e) => {
      e.target.disabled = true;
      const errEl = card.querySelector('.err');
      errEl.textContent = '正在删除并重建站点…（约 10 秒）';
      try {
        const r = await api('admin/api/delete', { url: b.url, name: b.name, blacklist: card.querySelector('#d-black').checked });
        if (r.ok) { blogsCache = null; renderBlogs.limit = 30; renderManage(); } else { errEl.textContent = r.error || '失败'; e.target.disabled = false; }
      } catch (err) { if (err.message !== 'unauthorized') { errEl.textContent = String(err); e.target.disabled = false; } }
    };
  }
}

// ---------- 访问统计 ----------

async function loadStats() {
  const pane = shell.querySelector('#pane');
  pane.innerHTML = '<div class="empty">加载中…</div>';
  const { stats } = await api('admin/api/stats');
  pane.innerHTML = '';
  const cards = $(`<div class="stats-cards">
    <div class="scard"><div class="num">${stats.pvToday}</div><div class="lbl">今日浏览</div></div>
    <div class="scard"><div class="num">${stats.pvYesterday}</div><div class="lbl">昨日浏览</div></div>
    <div class="scard"><div class="num">${stats.pv7}</div><div class="lbl">近 7 天浏览</div></div>
    <div class="scard"><div class="num">${stats.pvTotal}</div><div class="lbl">30 天浏览合计</div></div>
    <div class="scard"><div class="num">${stats.clickTotal}</div><div class="lbl">30 天博客点击</div></div>
  </div>`);
  pane.appendChild(cards);

  const chart = $(`<div class="card"><div class="desc" style="margin:0 0 4px">近 14 天浏览量（悬停看数值）</div><div class="bars"></div><div class="bar-lbls"></div></div>`);
  const last14 = stats.series.slice(-14);
  const max = Math.max(1, ...last14.map((s) => s.pv));
  const bars = chart.querySelector('.bars'), lbls = chart.querySelector('.bar-lbls');
  for (const s of last14) {
    bars.appendChild($(`<div class="bar" data-v="${s.date}：PV ${s.pv} / 点击 ${s.clicks}" style="height:${Math.max(2, Math.round(s.pv / max * 88))}px"></div>`));
    lbls.appendChild($(`<span>${s.date.slice(5)}</span>`));
  }
  pane.appendChild(chart);

  const two = $(`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px">
    <div class="card"><div class="desc" style="margin:0 0 6px">点击最多的博客（30 天）</div><div class="topc"></div></div>
    <div class="card"><div class="desc" style="margin:0 0 6px">来路域名 TOP（30 天）</div><div class="topr"></div></div>
  </div>`);
  const topc = two.querySelector('.topc'), topr = two.querySelector('.topr');
  if (!stats.topClicks.length) topc.innerHTML = '<div class="empty" style="padding:16px 0">暂无点击数据</div>';
  for (const c of stats.topClicks) topc.appendChild($(`<div class="done"><span>${esc(c.host)}</span><span>${c.total} 次</span></div>`));
  if (!stats.topRefs.length) topr.innerHTML = '<div class="empty" style="padding:16px 0">暂无来路数据</div>';
  for (const r of stats.topRefs) topr.appendChild($(`<div class="done"><span>${esc(r.host)}</span><span>${r.n}</span></div>`));
  pane.appendChild(two);
  pane.appendChild($(`<div class="desc" style="margin-top:12px">统计口径：列表页 PV + 博客卡片外链点击；匿名聚合计数，不记录 IP 与个人身份。</div>`));
}

// 入口：先探一下是否已登录
fetch('admin/api/list').then((r) => {
  if (r.status === 401) renderLogin();
  else { document.getElementById('loginState').style.display = ''; renderShell(); switchTab('pending'); }
}).catch(renderLogin);
</script>
</body></html>
